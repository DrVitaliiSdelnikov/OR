<ion-content>
  <div class="screen">
    <div class="top-bar">
      <button class="button" (click)="close()" aria-label="Назад к расчёту" data-test="weather-back">←</button>
      <h1>Полевая метеостанция · AB-совм.</h1>
    </div>

    <div class="station">
      <div class="impeller" aria-hidden="true"></div>
      <div class="lcd mono" data-test="lcd">
        @if (rows().length === 0) {
          <div class="lcd-row empty">— — —</div>
        }
        @for (row of rows(); track row.label) {
          <div class="lcd-row" [attr.data-test]="'lcd-' + row.label">
            <span>{{ row.label }}</span>
            <b>{{ row.value }}</b>
          </div>
        }
        @if (takenAt(); as time) {
          <div class="frozen">СНЯТО {{ time }}</div>
        }
      </div>
      <button class="button" (click)="nextPage()" data-test="lcd-page">◀ {{ pageIndex() + 1 }}/{{ pageCount }} ▶</button>
      <button class="button primary large" (click)="takeReading()" data-test="take-reading">СНЯТЬ ПОКАЗАНИЯ</button>
    </div>

    <p class="note">Показания «заморожены» с меткой времени. Ветер прибор меряет только у стрелка.</p>
    <button class="button" (click)="close()" [disabled]="!takenAt()" data-test="weather-done">К расчёту →</button>
  </div>
</ion-content>
