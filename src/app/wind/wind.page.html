<ion-content>
  <div class="screen">
    <div class="top-bar"><h1>«Часы» ветра</h1></div>

    <div class="card dial-card">
      <svg viewBox="0 0 260 260" width="260" height="260" class="dial" aria-label="Направление ветра">
        <circle [attr.cx]="dialCenter" [attr.cy]="dialCenter" r="124" class="rim" />
        <circle [attr.cx]="dialCenter" [attr.cy]="dialCenter" r="112" class="face" />
        <polygon points="130,10 122,26 138,26" class="target-mark" />
        <text x="130" y="44" class="target-label">ЦЕЛЬ ↑</text>
        @for (mark of hourMarks; track mark.hour) {
          <text [attr.x]="mark.x" [attr.y]="mark.y + 5" class="hour">{{ mark.hour }}</text>
        }
        <line [attr.x1]="dialCenter" [attr.y1]="dialCenter" [attr.x2]="arrow().x" [attr.y2]="arrow().y" class="arrow" />
        <circle [attr.cx]="dialCenter" [attr.cy]="dialCenter" r="6" class="hub" />
        @for (position of positions; track position.hours) {
          <circle
            [attr.cx]="position.x"
            [attr.cy]="position.y"
            r="14"
            class="hit"
            role="button"
            [attr.aria-label]="'С ' + position.hours + ' часов'"
            [attr.data-test]="'clock-' + position.hours"
            (click)="selectClock(position.hours)"
          />
        }
      </svg>
      <div class="mono clock">{{ clockText() }} · доля <span data-test="wind-share">{{ share().toFixed(2) }}</span></div>
    </div>

    <div class="label">Скорость, м/с</div>
    <div class="wheel" data-test="speed-wheel">
      @for (speed of speeds; track speed) {
        <button class="chip" [class.selected]="speed === speedMps()" (click)="speedMps.set(speed)" [attr.data-test]="'speed-' + speed">
          {{ speed.toFixed(1) }}
        </button>
      }
    </div>

    <div class="card results">
      <div class="row"><span>Боковой ветер</span><span class="spacer"></span><b class="mono" data-test="crosswind">{{ crosswind().toFixed(1) }} м/с</b></div>
      <div class="row"><span>Поправка, {{ session.distanceM() }} м</span><span class="spacer"></span><b class="mono accent-text">{{ correctionText() }}</b></div>
      <small>доля полного ветра на {{ clockText() }} ≈ {{ share().toFixed(2) }}</small>
    </div>

    <button class="button primary large" (click)="apply()" data-test="apply-wind">ПРИМЕНИТЬ К РАСЧЁТУ</button>
  </div>
</ion-content>
